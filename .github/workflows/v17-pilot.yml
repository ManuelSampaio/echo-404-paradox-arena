name: Validate v17 isolated pilot
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:v17
      - run: npm run test:bot:v17
      - run: npm run build:v17
      - run: node v17/tests/build.cjs
