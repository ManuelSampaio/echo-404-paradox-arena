name: Preserve v14.2 stable tag
on:
  push:
    branches: [feat/v15-final-playtest]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve immutable baseline
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v14.2.0-stable; then
            test "$(git ls-remote --tags origin refs/tags/v14.2.0-stable | cut -f1)" = "6ffc12015b1cec3928a8ddb3b8ece5fb2469e671"
          else
            git tag v14.2.0-stable 6ffc12015b1cec3928a8ddb3b8ece5fb2469e671
            git push origin refs/tags/v14.2.0-stable
          fi
